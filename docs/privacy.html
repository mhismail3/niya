<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Niya Privacy Policy</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #fbfaf7;
      --surface: #ffffff;
      --text: #1f2926;
      --muted: #5e6a65;
      --border: #e3ded2;
      --accent: #0f766e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111614;
        --surface: #171e1b;
        --text: #edf4f1;
        --muted: #aebbb6;
        --border: #2d3935;
        --accent: #5eead4;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: clamp(48px, 10vw, 96px) 24px;
    }

    article {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: clamp(28px, 6vw, 56px);
    }

    h1 {
      margin: 0 0 24px;
      color: var(--text);
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.125rem, 2vw, 1.35rem);
    }

    strong {
      color: var(--text);
      font-weight: 700;
    }

    article::before {
      display: block;
      width: 48px;
      height: 4px;
      margin-bottom: 28px;
      border-radius: 999px;
      background: var(--accent);
      content: "";
    }

    @media print {
      :root {
        --background: #ffffff;
        --surface: #ffffff;
        --text: #000000;
        --muted: #000000;
        --border: #d0d0d0;
        --accent: #000000;
      }

      body {
        background: #ffffff;
      }

      main {
        width: auto;
        padding: 0;
      }

      article {
        border: 0;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>Niya Privacy Policy</h1>
      <p><strong>Niya does not collect, store, or transmit any personal data.</strong></p>
    </article>
  </main>
</body>
</html>
