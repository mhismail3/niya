name: Feature request
description: Suggest a new feature or an improvement to Niya.
title: "[Feature]: "
labels: ["kind:idea", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What is hard, slow or impossible today? A concrete scenario beats an abstract wish.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for this request.
          required: true
